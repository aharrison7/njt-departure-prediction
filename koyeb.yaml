# Koyeb Service Configuration
# Documentation: https://www.koyeb.com/docs/reference/koyeb-yaml
name: njt-departure-prediction
type: web
ports:
  - port: 3000
    protocol: http
routes:
  - path: /
    port: 3000
regions:
  - was
instance_types:
  - type: free
scalings:
  - min: 1
    max: 1
env:
  NODE_ENV: production
  PORT: 3000
