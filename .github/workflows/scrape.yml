name: NJT Live Scraper & GitHub Pages Update

on:
  schedule:
    # Run every 1 minute continuously
    - cron: '* * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/checkout@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Scraper & Update Data
        run: |
          node -e "
            const { scrapeActiveStations } = require('./src/scraper');
            const DataStore = require('./src/data-store');
            const DepartedTracker = require('./src/departed-tracker');
            const { generatePredictions, getRecentCancellations } = require('./src/predictor');
            const { getAllStationStops } = require('./src/route-stops');

            async function run() {
              const dataStore = new DataStore();
              await dataStore.init();
              const tracker = new DepartedTracker();

              const result = await scrapeActiveStations();
              const penn = result.stations.nyPenn || [];
              const jersey = result.stations.jerseyAve || [];
              const currentBoard = [...penn, ...jersey];

              const recentlyDeparted = tracker.update(currentBoard, 'NJ Transit');
              const history = await dataStore.updateHistory(currentBoard);
              const cancellations = await dataStore.recordCancellations(currentBoard);
              const trackRegistry = await dataStore.updateTrackRegistry(currentBoard);
              const predictions = generatePredictions(currentBoard, history, trackRegistry);
              const recentCancellations = getRecentCancellations(cancellations);

              const apiData = {
                lastUpdated: new Date().toISOString(),
                activeStation: 'Penn Station NY & Jersey Ave',
                activeWindow: 'live',
                scrapeTime: 'github-actions',
                currentBoard,
                recentlyDeparted,
                predictions,
                cancellations: { recentByTrain: recentCancellations },
                enRouteCancellations: [],
                trackRegistry: trackRegistry.tracks || [],
                allStops: getAllStationStops()
              };

              await dataStore.writeApiData(apiData);
              console.log('GitHub Actions 1-minute live scrape complete:', currentBoard.length, 'trains');
            }
            run().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated 1-Minute Live Data Scrape [skip ci]" && git push)
