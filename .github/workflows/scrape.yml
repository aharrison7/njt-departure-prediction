name: NJT Live Scraper (Manual Fallback Only)

# Automated scheduled scraping is handled 24/7 directly by the Render server.
# GitHub Actions runs only on manual dispatch to prevent overwriting Render.
on:
  workflow_dispatch: # Allows optional manual trigger from GitHub UI

concurrency:
  group: njt-live-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Scraper & Update Data
        run: |
          node -e "
            const { scrapeActiveStations, closeBrowser } = require('./src/scraper');
            const DataStore = require('./src/data-store');
            const DepartedTracker = require('./src/departed-tracker');
            const { generatePredictions, getRecentCancellations } = require('./src/predictor');
            const { getAllStationStops } = require('./src/route-stops');

            async function run() {
              try {
                const dataStore = new DataStore();
                await dataStore.init();
                const tracker = new DepartedTracker();

                const result = await scrapeActiveStations();
                const currentBoard = result.stations.nyPenn || [];

                const recentlyDeparted = tracker.update(currentBoard, 'NJ Transit');
                const history = await dataStore.updateHistory(currentBoard);
                const cancellations = await dataStore.recordCancellations(currentBoard);
                const trackRegistry = await dataStore.updateTrackRegistry(currentBoard);
                const predictions = generatePredictions(currentBoard, history, trackRegistry);
                const recentCancellations = getRecentCancellations(cancellations);

                const apiData = {
                  lastUpdated: new Date().toISOString(),
                  activeStation: 'Penn Station New York',
                  activeWindow: 'live',
                  scrapeTime: 'github-actions',
                  currentBoard,
                  recentlyDeparted,
                  predictions,
                  cancellations: { recentByTrain: recentCancellations },
                  enRouteCancellations: [],
                  trackRegistry: trackRegistry.tracks || [],
                  allStops: getAllStationStops()
                };

                await dataStore.writeApiData(apiData);
                console.log('GitHub Actions live scrape complete:', currentBoard.length, 'trains');
              } finally {
                await closeBrowser();
              }
            }
            run().then(() => process.exit(0)).catch(err => { console.error(err); process.exit(1); });
          "

      - name: Commit and Push Track History & Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/track_registry.json data/cancellations.json data/api_data.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update persistent 30-day track history & live data [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

