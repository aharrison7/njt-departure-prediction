name: NJT Live Scraper & GitHub Pages Update

on:
  schedule:
    # Run every 5 minutes continuously
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/checkout@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Scraper & Update Data
        env:
          SCRAPE_ON_STARTUP: 'true'
        run: |
          node -e "
            const { scrapeAfternoon } = require('./src/scraper');
            const DataStore = require('./src/data-store');
            const DepartedTracker = require('./src/departed-tracker');
            const { generatePredictions, detectEnRouteCancellations, getRecentCancellations } = require('./src/predictor');
            const { getAllStationStops } = require('./src/route-stops');

            async function run() {
              const dataStore = new DataStore();
              await dataStore.init();
              const tracker = new DepartedTracker();

              const result = await scrapeAfternoon();
              const penn = result.stations.nyPenn || [];
              const edison = result.stations.edison || [];
              const recentlyDeparted = tracker.update(penn, 'NY Penn');
              const history = await dataStore.updateHistory(penn);
              const cancellations = await dataStore.recordCancellations([...penn, ...edison]);
              const trackRegistry = await dataStore.updateTrackRegistry(penn);
              const predictions = generatePredictions(penn, history, trackRegistry);
              const enRoute = detectEnRouteCancellations(penn, edison);
              const recentCancellations = getRecentCancellations(cancellations);

              const apiData = {
                lastUpdated: new Date().toISOString(),
                activeStation: 'Penn Station New York',
                activeWindow: 'live',
                scrapeTime: 'github-actions',
                currentBoard: penn,
                recentlyDeparted: recentlyDeparted,
                edisonBoard: edison,
                predictions,
                cancellations: { recentByTrain: recentCancellations },
                enRouteCancellations: enRoute,
                trackRegistry: trackRegistry.tracks || [],
                allStops: getAllStationStops()
              };

              await dataStore.writeApiData(apiData);
              console.log('GitHub Actions live scrape complete');
            }
            run().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Live Data Scrape [skip ci]" && git push)
